<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Clock Lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #9f9; font: 12px monospace; }
  #out { padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="out"></div>

<!-- Same reporting channel as the main app: everything is prefixed for the log. -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script>
(function () {
  'use strict';
  var TAG = '[clocklab]';

  function emit(line) {
    try { console.log(TAG + ' ' + line); } catch (e) {}
    var el = document.getElementById('out');
    if (el) { el.textContent += line + '\n'; }
  }

  // Route upstream print() into the device log, and be loud on failure: a silent
  // renderer crash is otherwise indistinguishable from a hang.
  window.print = emit;
  window.onerror = function (msg, src, line) {
    emit('lab-error ' + msg + ' @' + line);
    return false;
  };
  window.addEventListener('unhandledrejection', function () { emit('lab-reject'); });

  // The receiver must still start, or the cast session never reaches ready.
  try {
    var ctx = cast.framework.CastReceiverContext.getInstance();
    ctx.addCustomMessageListener('urn:x-cast:com.clock.lab', function (e) {
      emit('recv ' + JSON.stringify(e.data || {}));
    });
    ctx.start();
    emit('lab-receiver-started');
  } catch (e) {
    emit('lab-cast-error ' + ((e && e.message) || e));
  }

  emit('lab-boot onerror=armed');
  emit('lab-start');
  try {
    var s = document.createElement('script');
    s.src = 'lab/poc-offsets.js';
    s.onload = function () { emit('lab-loaded'); };
    s.onerror = function () { emit('lab-script-missing'); };
    document.body.appendChild(s);
  } catch (e) {
    emit('lab-threw ' + e.name);
  }
}());
</script>
</body>
</html>
